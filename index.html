<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оценить игры</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
  }

  body {
    background: #121212;
    color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  /* Плашка с оценкой сверху */
  .top-result {
    width: 100%;
    max-width: 500px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 25px;
    display: none;
    border: 2px solid transparent;
  }

  .top-result.show {
    display: block;
  }

  .top-result.red {
    background: #3a1414;
    color: #ff5555;
    border-color: #ff5555;
  }

  .top-result.gray {
    background: #2a2a2a;
    color: #bbbbbb;
    border-color: #bbbbbb;
  }

  .top-result.green {
    background: #143a1c;
    color: #4caf50;
    border-color: #4caf50;
  }

  .header {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 40px;
    text-align: center;
    color: #ffffff;
    border-bottom: 2px solid #2a2a2a;
    padding-bottom: 20px;
    width: 100%;
    max-width: 500px;
  }

  /* Кликабельная карточка игры */
  .game-card {
    background: #1e1e1e;
    border-radius: 12px;
    padding: 25px;
    width: 100%;
    max-width: 500px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #2a2a2a;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }

  .game-card:hover {
    border-color: #f5c518;
    transform: translateY(-2px);
  }

  .game-icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 15px;
    display: block;
  }

  .game-title {
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .game-hint {
    font-size: 14px;
    color: #888888;
  }

  /* Модальное окно */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.show {
    display: flex;
  }

  .modal {
    background: #1e1e1e;
    border-radius: 14px;
    padding: 30px 25px;
    width: 100%;
    max-width: 560px;
    border: 1px solid #2a2a2a;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    text-align: center;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    fill: #777777;
    transition: fill 0.2s;
  }

  .modal-close:hover {
    fill: #ffffff;
  }

  .modal-title {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 22px;
    color: #ffffff;
  }

  /* Звёзды в одну строку */
  .stars {
    display: flex;
    justify-content: center;
    flex-wrap: nowrap;
    gap: 4px;
    margin-bottom: 18px;
  }

  .star {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    cursor: pointer;
    transition: transform 0.15s;
    fill: #3a3a3a;
  }

  .star:hover {
    transform: scale(1.15);
  }

  .star.active {
    fill: #f5c518;
  }

  .score-text {
    font-size: 16px;
    color: #aaaaaa;
    margin-bottom: 18px;
    min-height: 22px;
  }

  .thanks {
    font-size: 18px;
    color: #4caf50;
    font-weight: bold;
    margin-bottom: 12px;
    min-height: 24px;
  }

  .screenshot-text {
    font-size: 15px;
    color: #dddddd;
    line-height: 1.5;
    min-height: 22px;
  }

  .screenshot-text b {
    color: #f5c518;
  }

  .locked .star {
    cursor: not-allowed;
    opacity: 0.6;
  }

  .locked .star:hover {
    transform: none;
  }

  /* Адаптив для маленьких экранов */
  @media (max-width: 480px) {
    .star {
      width: 26px;
      height: 26px;
    }
    .modal {
      padding: 24px 14px;
    }
    .header {
      font-size: 26px;
    }
  }
</style>
</head>
<body>

  <!-- Плашка с результатом сверху -->
  <div class="top-result" id="topResult"></div>

  <div class="header">Оценить игры</div>

  <!-- Карточка игры (клик открывает окно) -->
  <div class="game-card" id="gameCard">
    <svg class="game-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M7 6h10a5 5 0 0 1 4.9 4l1 5a3 3 0 0 1-5.2 2.5L16 16H8l-1.7 1.5A3 3 0 0 1 1.1 15l1-5A5 5 0 0 1 7 6zm0 2a3 3 0 0 0-2.9 2.4l-1 5a1 1 0 0 0 1.7.8L7 14h10l2.2 2.2a1 1 0 0 0 1.7-.8l-1-5A3 3 0 0 0 17 8H7zm1 2v2H6v2h2v2h2v-2h2v-2h-2v-2H8zm8 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2z" fill="#f5c518"/>
    </svg>
    <div class="game-title">Standoff 2 mini 3D</div>
    <div class="game-hint">Нажмите, чтобы оценить</div>
  </div>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <svg class="modal-close" id="modalClose" viewBox="0 0 24 24">
        <path d="M18.3 5.7a1 1 0 0 0-1.4 0L12 10.6 7.1 5.7a1 1 0 1 0-1.4 1.4L10.6 12l-4.9 4.9a1 1 0 1 0 1.4 1.4L12 13.4l4.9 4.9a1 1 0 0 0 1.4-1.4L13.4 12l4.9-4.9a1 1 0 0 0 0-1.4z"/>
      </svg>

      <div class="modal-title">Standoff 2 mini 3D</div>

      <div class="stars" id="stars">
        <svg class="star" data-value="1" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="2" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="3" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="4" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="5" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="6" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="7" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="8" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="9" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <svg class="star" data-value="10" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
      </div>

      <div class="score-text" id="scoreText">Выберите оценку от 1 до 10</div>
      <div class="thanks" id="thanks"></div>
      <div class="screenshot-text" id="screenshotText"></div>
    </div>
  </div>

<script>
  const GAME_ID = "standoff2_mini_3d";
  const STORAGE_KEY = "rating_" + GAME_ID;

  const gameCard = document.getElementById("gameCard");
  const modalOverlay = document.getElementById("modalOverlay");
  const modal = document.getElementById("modal");
  const modalClose = document.getElementById("modalClose");
  const stars = document.querySelectorAll(".star");
  const scoreText = document.getElementById("scoreText");
  const thanks = document.getElementById("thanks");
  const screenshotText = document.getElementById("screenshotText");
  const topResult = document.getElementById("topResult");

  let currentRating = 0;

  // Проверка: голосовал ли уже
  function hasVoted() {
    return localStorage.getItem(STORAGE_KEY) !== null;
  }

  // Определяем цвет по оценке
  function getColorClass(value) {
    if (value <= 3) return "red";     // 1–3 красный
    if (value <= 7) return "gray";    // 4–7 серый
    return "green";                    // 8–10 зелёный
  }

  // Показать плашку сверху
  function showTopResult(value) {
    topResult.className = "top-result show " + getColorClass(value);
    topResult.textContent = "Вы оценили игру на " + value + " из 10";
  }

  // Отрисовка звёзд
  function paintStars(value) {
    stars.forEach(star => {
      const v = parseInt(star.dataset.value);
      if (v <= value) star.classList.add("active");
      else star.classList.remove("active");
    });
  }

  // Заблокировать голосование
  function lockVoting() {
    modal.classList.add("locked");
    stars.forEach(star => star.style.pointerEvents = "none");
  }

  // Показать состояние "уже голосовал"
  function showAlreadyVoted(savedValue) {
    paintStars(savedValue);
    scoreText.textContent = "Ваша оценка: " + savedValue + " из 10";
    thanks.textContent = "Спасибо что оценили нашу игру!";
    screenshotText.innerHTML = "Заскриншоте эту страницу и отправьте <b>by Arseniy</b> в Max";
    showTopResult(savedValue);
    lockVoting();
  }

  // Открыть окно
  function openModal() {
    if (hasVoted()) {
      const saved = parseInt(localStorage.getItem(STORAGE_KEY));
      showAlreadyVoted(saved);
    }
    modalOverlay.classList.add("show");
  }

  // Закрыть окно
  function closeModal() {
    modalOverlay.classList.remove("show");
  }

  gameCard.addEventListener("click", openModal);
  modalClose.addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  // Наведение и клик по звёздам
  stars.forEach(star => {
    star.addEventListener("mouseenter", () => {
      if (hasVoted()) return;
      const value = parseInt(star.dataset.value);
      paintStars(value);
      scoreText.textContent = value + " из 10";
    });

    star.addEventListener("mouseleave", () => {
      if (hasVoted()) return;
      paintStars(currentRating);
      scoreText.textContent = currentRating === 0
        ? "Выберите оценку от 1 до 10"
        : currentRating + " из 10";
    });

    star.addEventListener("click", () => {
      if (hasVoted()) return;

      const value = parseInt(star.dataset.value);
      currentRating = value;
      paintStars(value);

      localStorage.setItem(STORAGE_KEY, value);

      scoreText.textContent = "Ваша оценка: " + value + " из 10";
      thanks.textContent = "Спасибо что оценили нашу игру!";
      screenshotText.innerHTML = "Заскриншоте эту страницу и отправьте <b>by Arseniy</b> в Max";

      showTopResult(value);
      lockVoting();
    });
  });

  // При загрузке — если уже голосовал, показываем плашку сверху
  window.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved !== null) {
      showTopResult(parseInt(saved));
    }
  });
</script>

</body>
 </html>
